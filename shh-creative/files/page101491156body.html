m/@mediapipe/hands/hands.js" crossorigin="anonymous"></script> <script>let handsData={list:[]};const container=document.getElementById('main-canvas-container');const mousePosition={x:0,y:0,isActive:false};const MAX_CARPET_HEIGHT=5;const SEGMENTS=100;const DAMPING=0.92;const SPRING_TENSION=0.01;const POKE_FORCE=-0.02;const WAVE_SPREAD=0.08;const INTERACTION_RADIUS=1.5;let scene,camera,renderer,planeMesh;let originalVertices,vertexVelocities;let raycaster,interactionPoint;function initThree() {scene=new THREE.Scene();const aspect=window.innerWidth/window.innerHeight;camera=new THREE.PerspectiveCamera(75,aspect,0.1,1000);camera.position.z=7;const ambientLight=new THREE.AmbientLight(0xffffff,0.5);scene.add(ambientLight);const dirLight=new THREE.DirectionalLight(0xffffff,1.0);dirLight.position.set(5,10,7.5);scene.add(dirLight);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(window.innerWidth,window.innerHeight);renderer.setPixelRatio(window.devicePixelRatio);container.appendChild(renderer.domElement);const loader=new THREE.TextureLoader();loader.load('https://i.postimg.cc/8Prj7d7d/carpet-3.png',(texture)=>{const textureAspect=texture.image.width/texture.image.height;const planeHeight=MAX_CARPET_HEIGHT;const planeWidth=planeHeight*textureAspect;const geometry=new THREE.PlaneGeometry(planeWidth,planeHeight,SEGMENTS,SEGMENTS);const material=new THREE.MeshStandardMaterial({map:texture,side:THREE.DoubleSide,roughness:0.8,metalness:0.1});planeMesh=new THREE.Mesh(geometry,material);scene.add(planeMesh);originalVertices=new Float32Array(geometry.attributes.position.array);vertexVelocities=new Float32Array(geometry.attributes.position.count).fill(0);});raycaster=new THREE.Raycaster();interactionPoint=new THREE.Vector2();animate();}
function animate() {requestAnimationFrame(animate);if(planeMesh) {updateWavePhysics();renderer.render(scene,camera);}}
function updateWavePhysics() {const positions=planeMesh.geometry.attributes.position;const vertex=new THREE.Vector3();const gridWidth=SEGMENTS + 1;handsData.list.forEach(hand=>{interactionPoint.x=(hand.x*2) - 1;interactionPoint.y=-(hand.y*2) + 1;raycaster.setFromCamera(interactionPoint,camera);const intersects=raycaster.intersectObject(planeMesh);if(intersects.length>0) {const hitPoint=intersects[0].point;for(let i=0;i<positions.count;i++) {vertex.fromBufferAttribute(positions,i);planeMesh.localToWorld(vertex);const dist=vertex.distanceTo(hitPoint);if(dist<INTERACTION_RADIUS) {const force=POKE_FORCE*(1 - dist/INTERACTION_RADIUS);vertexVelocities[i]+=force;}}}});for(let i=0;i<positions.count;i++) {const originalZ=originalVertices[i*3 + 2];const currentZ=positions.getZ(i);let springForce=(originalZ - currentZ)*SPRING_TENSION;let spreadForce=0;const row=Math.floor(i/gridWidth);const col=i%gridWidth;if(col>0) spreadForce+=(positions.getZ(i - 1) - currentZ);if(col<SEGMENTS) spreadForce+=(positions.getZ(i + 1) - currentZ);if(row>0) spreadForce+=(positions.getZ(i - gridWidth) - currentZ);if(row<SEGMENTS) spreadForce+=(positions.getZ(i + gridWidth) - currentZ);vertexVelocities[i]+=springForce +(spreadForce*WAVE_SPREAD);vertexVelocities[i]*=DAMPING;}
for(let i=0;i<positions.count;i++) {positions.setZ(i,positions.getZ(i) + vertexVelocities[i]);}
planeMesh.geometry.computeVertexNormals();positions.needsUpdate=true;}
function onWindowResize() {camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);}
window.addEventListener('resize',onWindowResize);function onMouseMove(event) {mousePosition.isActive=true;mousePosition.x=event.clientX/window.innerWidth;mousePosition.y=event.clientY/window.innerHeight;}
