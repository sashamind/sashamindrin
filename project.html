<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project — Sasha Mindrin</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .project-header {
      margin-bottom: 48px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 24px;
      flex-wrap: wrap;
    }

    .project-title {
      font-size: clamp(24px, 4vw, 40px);
      font-weight: 400;
      letter-spacing: -0.02em;
    }

    .project-meta {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
    }

    .meta-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .meta-key {
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0.1em;
      color: var(--fg2);
      text-transform: uppercase;
    }

    .meta-val {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.04em;
      color: var(--fg);
    }

    .project-divider {
      border: none;
      border-top: 0.5px solid var(--border);
      margin-bottom: 48px;
    }

    .project-gallery {
      display: flex;
      flex-direction: column;
      gap: 1px;
      margin-bottom: 48px;
    }

    .gallery-img {
      width: 100%;
      aspect-ratio: 16 / 9;
      background-color: var(--card-hover);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .gallery-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .gallery-img.tall {
      aspect-ratio: 4 / 3;
    }

    .gallery-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
    }

    .gallery-row .gallery-img {
      aspect-ratio: 1 / 1;
    }

    .project-desc {
      max-width: 560px;
      margin-bottom: 64px;
    }

    .project-desc p {
      font-size: 15px;
      line-height: 1.75;
      color: var(--fg);
    }

    .project-nav {
      display: flex;
      justify-content: space-between;
      border-top: 0.5px solid var(--border);
      padding-top: 24px;
    }

    .project-nav a {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.06em;
      color: var(--fg2);
      transition: color 0.2s;
    }

    .project-nav a:hover {
      color: var(--fg);
    }

    @media (max-width: 600px) {
      .project-header {
        flex-direction: column;
        gap: 20px;
      }

      .gallery-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body class="dark">

  <header>
    <a class="site-name" href="index.html">Sasha Mindrin</a>
    <button class="burger-btn" id="burgerBtn">menu</button>
  </header>

  <div class="nav-overlay" id="navOverlay"></div>
  <nav class="nav-menu" id="navMenu">
    <a href="index.html" data-en="work" data-ru="работы">work</a>
    <a href="about.html" data-en="about" data-ru="обо мне">about</a>
    <a href="contact.html" data-en="contact" data-ru="контакт">contact</a>
    <button class="lang-btn" id="langToggle">RU</button>
  </nav>

  <main>
    <div class="project-header">
      <h1 class="project-title" id="projectTitle">Project</h1>
      <div class="project-meta">
        <div class="meta-item">
          <span class="meta-key" data-en="year" data-ru="год">year</span>
          <span class="meta-val" id="projectYear">—</span>
        </div>
        <div class="meta-item">
          <span class="meta-key" data-en="type" data-ru="тип">type</span>
          <span class="meta-val" id="projectType">—</span>
        </div>
      </div>
    </div>

    <hr class="project-divider" />

    <div class="project-gallery" id="projectGallery">
      <!-- изображения подставляются скриптом -->
      <div class="gallery-img"></div>
      <div class="gallery-row">
        <div class="gallery-img"></div>
        <div class="gallery-img"></div>
      </div>
      <div class="gallery-img tall"></div>
    </div>

    <div class="project-desc">
      <p id="projectDesc" data-en="Project description will appear here." data-ru="Описание проекта появится здесь.">
        Project description will appear here.
      </p>
    </div>

    <nav class="project-nav">
      <a href="index.html#work" data-en="← all work" data-ru="← все работы">← all work</a>
      <a href="#" id="nextProject" data-en="next →" data-ru="следующий →">next →</a>
    </nav>
  </main>

  <footer>
    <span class="footer-copy">Sasha Mindrin</span>
  </footer>

  <script src="main.js"></script>
  <script>
    // Read project id from URL and populate page
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id') || 'project-1';

    // Minimal project data — replace with real content when ready
    const projects = {
      'project-1': { titleEn: 'Project 1', titleRu: 'Проект 1', year: '2024', type: 'identity' },
      'project-2': { titleEn: 'Project 2', titleRu: 'Проект 2', year: '2024', type: 'motion' },
      'project-3': { titleEn: 'Project 3', titleRu: 'Проект 3', year: '2023', type: 'branding' },
      'project-4': { titleEn: 'Project 4', titleRu: 'Проект 4', year: '2023', type: 'identity' },
      'project-5': { titleEn: 'Project 5', titleRu: 'Проект 5', year: '2023', type: 'illustration' },
      'project-6': { titleEn: 'Project 6', titleRu: 'Проект 6', year: '2022', type: 'motion' },
    };

    const projectIds = Object.keys(projects);
    const currentIndex = projectIds.indexOf(id);
    const data = projects[id] || projects['project-1'];

    // Set title
    const titleEl = document.getElementById('projectTitle');
    titleEl.dataset.en = data.titleEn;
    titleEl.dataset.ru = data.titleRu;
    titleEl.textContent = data.titleEn;

    document.title = data.titleEn + ' — Sasha Mindrin';
    document.getElementById('projectYear').textContent = data.year;
    document.getElementById('projectType').textContent = data.type;

    // Next project link
    const nextIndex = (currentIndex + 1) % projectIds.length;
    const nextId = projectIds[nextIndex];
    document.getElementById('nextProject').href = 'project.html?id=' + nextId;

    // Populate gallery images if assets exist
    const gallery = document.getElementById('projectGallery');
    const imgs = gallery.querySelectorAll('.gallery-img');
    imgs.forEach((div, i) => {
      const img = document.createElement('img');
      img.src = 'assets/projects/' + id + '/img-' + (i + 1) + '.png';
      img.alt = data.titleEn + ' image ' + (i + 1);
      img.onerror = () => img.remove();
      div.appendChild(img);
    });
  </script>
</body>
</html>
