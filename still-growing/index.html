<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Still growing</title>
<!--
  Still growing — интерактив: плоская иконка черепа из серых квадратов, под
  курсором (пальцем) проявляется живой череп во мху, сыплются лепестки.
  Код мозаики — из старого интерактива «flowers over power» (Тильда,
  interactive_flowersoverpower). Скрытая страница: не в галерее, не в
  sitemap, закрыта от поиска (noindex). Рабочая копия — _lab/flowers-over-power.
-->
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Still growing — interactive by Sasha Mindrin.">
<link rel="icon" href="../favicon.ico?v=20261020-1" sizes="48x48">
<link rel="icon" href="../favicon.svg?v=20261020-1" type="image/svg+xml">
<link rel="apple-touch-icon" href="../apple-touch-icon.png?v=20261020-1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: #fff; color: #8c8c8c; display: grid; place-items: center; overflow: hidden; }
  /* заголовок по центру: первое слово — сверху, второе — снизу. Буквы собраны из тех же серых квадратов, что мозаика (см. скрипт
     внизу); текст в h1 остаётся для поиска и читалок */
  .w { position: fixed; z-index: 2; display: block; touch-action: none; }
  h1 .t { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .w1 { left: 50%; top: clamp(16px, 3vw, 40px); transform: translateX(-50%); }
  .w2 { left: 50%; bottom: clamp(16px, 3vw, 40px); transform: translateX(-50%); }
  /* меньше, чем было на Тильде (90vw / 70vw, до 800px): 72vw / 56vw, до 640px,
     и не выше экрана */
  /* поле интерактива — точно в центре экрана */
  #three-container { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(83vw, 736px, 80vh); aspect-ratio: 1 / 1; background: #fff; touch-action: none; }
  @media (min-width: 768px) { #three-container { width: min(64vw, 736px, 80vh); } }
  /* горизонтальный экран: поле ниже по высоте — сверху и снизу место под слова */
  @media (min-aspect-ratio: 1/1) { #three-container { width: min(64vw, 736px, 60vh); } }
  /* маленькие экраны: череп крупнее — почти во всю ширину телефона,
     а у телефона боком — почти во всю высоту (слова мельчают сами) */
  @media (max-width: 480px) and (max-aspect-ratio: 1/1) { #three-container { width: min(94vw, 80vh); } }
  @media (max-height: 500px) and (min-aspect-ratio: 1/1) { #three-container { width: min(64vw, 74vh); } }
</style>
</head>

<script>
// Слова заголовка — пиксельные: слово набирается тонким курсивом с засечками
// (Cormorant Garamond Italic 500) на невидимом холсте и раскладывается на
// пиксели размером с квадрат мозаики до наведения (0.4 шага интерактива,
// шаг = ширина поля / число клеток: 40, на телефоне меньше — см. обрезку), светло-серым, вплотную, без промежутков: пиксель
// закрашен, если буква занимает больше 40% его площади.
// Пиксели рисуются по целым точкам экрана — между соседними нет швов.
// Если слово упирается в череп (невысокие экраны), оба слова мельчают одинаково.
// Наведение (или палец): пиксели рядом с курсором мягко расходятся в стороны
// и пружинят обратно.
(function(){
  const SQ=0.4, CAP=9.5, MIN_CAP=4, COLOR='rgb(230,230,230)', PAD=3, R=7, PUSH=0.9;
  const box=document.getElementById('three-container');
  const words=[...document.querySelectorAll('canvas.w')], state=new Map();
  function build(cv, cap){
    const GRID=window.fopGrid||40, step=box.clientWidth/GRID, px=step*SQ, word=cv.dataset.word;
    const font='italic 500 '+(step*cap/0.72)+'px "Cormorant Garamond", Georgia, serif';
    const m=document.createElement('canvas').getContext('2d'); m.font=font;
    const mt=m.measureText(word), asc=mt.actualBoundingBoxAscent, desc=mt.actualBoundingBoxDescent, left=mt.actualBoundingBoxLeft, tw=left+mt.actualBoundingBoxRight;
    const cols=Math.ceil(tw/px)+2+2*PAD, rows=Math.ceil((asc+desc)/px)+2+2*PAD;
    const off=document.createElement('canvas'); off.width=Math.ceil(cols*px); off.height=Math.ceil(rows*px);
    const o=off.getContext('2d'); o.font=font; o.fillStyle='#000'; o.fillText(word, (PAD+1)*px+left, (PAD+1)*px+asc);
    const data=o.getImageData(0,0,off.width,off.height).data, cells=[];
    for(let r=0;r<rows;r++)for(let q=0;q<cols;q++){
      let n=0,on=0; const x0=Math.floor(q*px),x1=Math.min(off.width,Math.floor((q+1)*px)),y0=Math.floor(r*px),y1=Math.min(off.height,Math.floor((r+1)*px));
      for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){n++; if(data[(y*off.width+x)*4+3]>128) on++;}
      if(n&&on/n>0.4) cells.push({q,r,ox:0,oy:0});
    }
    return {px,cols,rows,cells,ptr:null};
  }
  function place(cv,s){
    const dpr=window.devicePixelRatio||1, W=s.cols*s.px, H=s.rows*s.px;
    cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); cv.style.width=W+'px'; cv.style.height=H+'px';
    // прозрачный запас по краям (под смещения) — по вертикали не отодвигает
    // буквы от края экрана; по горизонтали слово центруется вместе с запасом
    cv.style.margin=(-PAD*s.px)+'px 0';
  }
  function paint(cv,s){
    const dpr=window.devicePixelRatio||1, c=cv.getContext('2d');
    c.setTransform(1,0,0,1,0,0); c.clearRect(0,0,cv.width,cv.height); c.fillStyle=COLOR;
    for(const e of s.cells){
      const x=(e.q*s.px+e.ox)*dpr, y=(e.r*s.px+e.oy)*dpr, X0=Math.round(x), Y0=Math.round(y);
      c.fillRect(X0, Y0, Math.round(x+s.px*dpr)-X0, Math.round(y+s.px*dpr)-Y0);
    }
  }
  function overlaps(cv,s){
    // мешает только сам череп (рамка иконки внутри поля), пустые поля вокруг можно занимать
    const a=cv.getBoundingClientRect(), B=box.getBoundingClientRect(), k=window.fopInk||[0,0,1,1], ins=PAD*s.px, gap=box.clientWidth/(window.fopGrid||40);
    const b={left:B.left+k[0]*B.width, top:B.top+k[1]*B.height, right:B.left+k[2]*B.width, bottom:B.top+k[3]*B.height};
    // слишком широкое для экрана (поля по 16px) — тоже считается «не помещается»
    if(a.width-2*ins>window.innerWidth-32) return true;
    return a.left+ins<b.right+gap && a.right-ins>b.left-gap && a.top+ins<b.bottom+gap && a.bottom-ins>b.top-gap;
  }
  // кегль общий для обоих слов: уменьшается, пока хоть одно упирается в поле
  function layout(){
    let cap=CAP, ss;
    for(;;){
      ss=words.map(cv=>{ const s=build(cv,cap); place(cv,s); return s; });
      if(cap<=MIN_CAP||!words.some((cv,i)=>overlaps(cv,ss[i]))) break;
      cap-=0.5;
    }
    words.forEach((cv,i)=>{ state.set(cv,ss[i]); paint(cv,ss[i]); });
  }
  let raf=0;
  function tick(){
    raf=0; let moving=false;
    state.forEach((s,cv)=>{
      let changed=false;
      for(const e of s.cells){
        let tx=0, ty=0;
        if(s.ptr){
          const dx=(e.q+0.5)*s.px-s.ptr[0], dy=(e.r+0.5)*s.px-s.ptr[1], d=Math.hypot(dx,dy)/s.px;
          if(d<R&&d>0){ const f=Math.pow(1-d/R,2)*PUSH*s.px; tx=dx/(d*s.px)*f; ty=dy/(d*s.px)*f; }
        }
        const nx=e.ox+(tx-e.ox)*0.16, ny=e.oy+(ty-e.oy)*0.16;
        if(Math.abs(nx-e.ox)>0.01||Math.abs(ny-e.oy)>0.01) changed=true;
        e.ox=Math.abs(nx)<0.02&&!tx?0:nx; e.oy=Math.abs(ny)<0.02&&!ty?0:ny;
      }
      if(changed){ paint(cv,s); moving=true; }
      if(s.ptr) moving=true;
    });
    if(moving) raf=requestAnimationFrame(tick);
  }
  function kick(){ if(!raf) raf=requestAnimationFrame(tick); }
  words.forEach(cv=>{
    cv.addEventListener('pointermove',ev=>{ const s=state.get(cv); if(!s) return; const r=cv.getBoundingClientRect(); s.ptr=[ev.clientX-r.left, ev.clientY-r.top]; kick(); });
    const leave=()=>{ const s=state.get(cv); if(s){ s.ptr=null; kick(); } };
    cv.addEventListener('pointerleave',leave); cv.addEventListener('pointerup',leave); cv.addEventListener('pointercancel',leave);
  });
  window.addEventListener('resize', layout);
  window.addEventListener('fop-grid', layout);
  Promise.all([document.fonts.load('italic 500 100px "Cormorant Garamond"'), document.fonts.ready]).then(layout, layout);
})();
</script>
