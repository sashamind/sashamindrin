<style>
  /* Мейнбук встроен во всю ширину панели кейса: отрицательные поля гасят
     её собственный padding (56px на десктопе, 20px на мобиле).
     isolation + собственный фон — чтобы screen смешивался именно с фоном
     страницы, а не с тем, что окажется под панелью. */
  .pf-mainbook {
    margin: 56px -56px 0;
    line-height: 0; /* убирает зазоры между строчными картинками */
    isolation: isolate;
    background: var(--bg);
  }
  .pf-mainbook img {
    width: 100%;
    height: auto;
    display: block;
    vertical-align: top;
    /* .pd-body img задаёт margin: 32px 0 — полосы должны стыковаться
       вплотную, иначе страница распадается на куски. Перекрытия в минус
       пиксель тут быть не должно: под screen нахлёст двух полос дал бы
       светлый шов, а обычный зазор невидим — он того же цвета, что и
       чёрная подложка макета после блендинга. */
    margin: 0;
  }
  /* Чёрная подложка мейнбука уходит в фон страницы. Только в тёмной теме:
     на белом фоне screen выжег бы полосы целиком. */
  body.dark .pf-mainbook img {
    mix-blend-mode: screen;
  }
  @media (max-width: 768px) {
    .pf-mainbook { margin: 32px -20px 0; }
  }
</style>
