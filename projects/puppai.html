<style>
  .pf-puppai {
    max-width: 560px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 110px 0 40px;
  }
  .pf-puppai img {
    width: auto;
    height: auto;
    max-width: 100%;
    object-fit: contain;
    display: block;
  }
  .pf-puppai [data-fx="scroll"] { will-change: opacity; }
  .pf-puppai .pup-logo { height: 112px; }
  .pf-puppai .pup-wordmark { width: 200px; margin-top: 240px; }
  .pf-puppai .pup-concept {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 72px;
    margin-top: 132px;
  }
  .pf-puppai .pup-concept img { width: 240px; }
  .pf-puppai .pup-appicon { width: 125px; margin-top: 132px; }
  .pf-puppai .pup-photo {
    width: 100%;
    max-width: 480px;
    margin-top: 48px;
  }
  /* Фон у снимков — не чистый чёрный, а тёмно-серый, поэтому он виден
     прямоугольником на фоне страницы. Растушёвываем края в прозрачность,
     чтобы граница растворялась в фоне (работает при любом тоне фона,
     в отличие от mix-blend-mode: screen, который тёмно-серое осветляет). */
  .pf-puppai .pup-feather {
    --f: 90px;
    -webkit-mask-image:
      linear-gradient(to right, transparent 0, #000 var(--f), #000 calc(100% - var(--f)), transparent 100%),
      linear-gradient(to bottom, transparent 0, #000 var(--f), #000 calc(100% - var(--f)), transparent 100%);
    -webkit-mask-composite: source-in;
    mask-image:
      linear-gradient(to right, transparent 0, #000 var(--f), #000 calc(100% - var(--f)), transparent 100%),
      linear-gradient(to bottom, transparent 0, #000 var(--f), #000 calc(100% - var(--f)), transparent 100%);
    mask-composite: intersect;
  }
  /* Чёрный фон снимков темнее фона страницы (#000 против #0a0a0a), поэтому
     feather снимает только края, а тёмный центр остаётся виден. screen
     поднимает чистый чёрный ровно до фона страницы — центр тоже сливается,
     объект «висит» без подложки. */
  .pf-puppai .pup-screen { mix-blend-mode: screen; }
</style>

<div class="pf-puppai">
  <img class="pup-logo" data-fx="scroll" src="assets/puppai/logo.svg" alt="PuppAI" />
  <img class="pup-wordmark" data-fx="scroll" src="assets/puppai/logoline.svg" alt="PUPPAi" />

  <div class="pup-concept">
    <img data-fx="scroll" src="assets/puppai/1.svg" alt="Puppy's butt" />
    <img data-fx="scroll" src="assets/puppai/2.svg" alt="Puppy, pet" />
    <img data-fx="scroll" src="assets/puppai/3.svg" alt="Singularity" />
    <img data-fx="scroll" src="assets/puppai/3-1.svg" alt="Intelligence" />
    <img data-fx="scroll" src="assets/puppai/4.svg" alt="Artificial" />
  </div>

  <img class="pup-appicon" data-fx="scroll" src="assets/puppai/group-3.svg" alt="App icon" />

  <img class="pup-photo pup-feather pup-screen" src="https://kzzsmdgsjnkhtbzhjlyl.supabase.co/storage/v1/object/public/portfolio/shh-creative/media/puppai-pic1.webp" alt="" loading="lazy" />
  <img class="pup-photo pup-feather pup-screen" src="https://kzzsmdgsjnkhtbzhjlyl.supabase.co/storage/v1/object/public/portfolio/shh-creative/media/puppai-group-23.webp" alt="" loading="lazy" />
  <img class="pup-photo pup-feather pup-screen" src="https://kzzsmdgsjnkhtbzhjlyl.supabase.co/storage/v1/object/public/portfolio/shh-creative/media/puppai-pic5.webp" alt="" loading="lazy" />
</div>
