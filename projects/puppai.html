<style>
  .pf-puppai {
    max-width: 560px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    /* Нижний отступ даёт запас прокрутки, чтобы последнее фото могло
       доехать до центра экрана и полностью проявиться (data-fx). */
    padding: 110px 0 220px;
  }
  .pf-puppai img {
    width: auto;
    height: auto;
    max-width: 100%;
    object-fit: contain;
    display: block;
  }
  .pf-puppai [data-fx="scroll"] { will-change: opacity; }
  .pf-puppai .pup-logo { height: 112px; }
  .pf-puppai .pup-wordmark { width: 200px; margin-top: 240px; }
  .pf-puppai .pup-concept {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 72px;
    margin-top: 132px;
  }
  .pf-puppai .pup-concept img { width: 168px; }
  .pf-puppai .pup-appicon { width: 125px; margin-top: 132px; }
  /* Фон снимков подгоняется под фон страницы (#0a0a0a) в самих файлах,
     поэтому mix-blend-mode не нужен. */
  .pf-puppai .pup-photo {
    width: 100%;
    max-width: 480px;
    margin-top: 48px;
  }
  /* Ошейник крупнее остальных на ~30% (480 → 624). Выходит за контейнер
     кейса (560), но панель на десктопе шире; на мобиле ограничиваем шириной
     панели, чтобы не появлялся горизонтальный скролл. */
  .pf-puppai .pup-collar { width: 624px; max-width: 100%; }
  @media (min-width: 769px) {
    .pf-puppai .pup-collar { max-width: 624px; }
  }
  /* Телефон на ~30% меньше остальных (480 → 336). */
  .pf-puppai .pup-phone { max-width: 336px; }
  /* Растушёвка краёв в прозрачность: жёсткая граница прямоугольника
     растворяется в фоне, тона не меняются. Значение в процентах, чтобы
     растушёвка масштабировалась под размер картинки (у телефона он меньше). */
  .pf-puppai .pup-feather {
    --f: 25%;
    -webkit-mask-image:
      linear-gradient(to right, transparent 0, #000 var(--f), #000 calc(100% - var(--f)), transparent 100%),
      linear-gradient(to bottom, transparent 0, #000 var(--f), #000 calc(100% - var(--f)), transparent 100%);
    -webkit-mask-composite: source-in;
    mask-image:
      linear-gradient(to right, transparent 0, #000 var(--f), #000 calc(100% - var(--f)), transparent 100%),
      linear-gradient(to bottom, transparent 0, #000 var(--f), #000 calc(100% - var(--f)), transparent 100%);
    mask-composite: intersect;
  }
</style>

<div class="pf-puppai">
  <img class="pup-logo" data-fx="scroll" src="assets/puppai/logo.svg" alt="PuppAI" />
  <img class="pup-wordmark" data-fx="scroll" src="assets/puppai/logoline.svg" alt="PUPPAi" />

  <div class="pup-concept">
    <img data-fx="scroll" src="assets/puppai/1.svg" alt="Puppy's butt" />
    <img data-fx="scroll" src="assets/puppai/2.svg" alt="Puppy, pet" />
    <img data-fx="scroll" src="assets/puppai/3.svg" alt="Singularity" />
    <img data-fx="scroll" src="assets/puppai/3-1.svg" alt="Intelligence" />
    <img data-fx="scroll" src="assets/puppai/4.svg" alt="Artificial" />
  </div>

  <img class="pup-appicon" data-fx="scroll" src="assets/puppai/group-3.svg" alt="App icon" />

  <img class="pup-photo" data-fx="scroll" src="https://kzzsmdgsjnkhtbzhjlyl.supabase.co/storage/v1/object/public/portfolio/shh-creative/media/puppai-pic1.webp" alt="" loading="lazy" />
  <img class="pup-photo pup-feather pup-collar" data-fx="scroll" src="https://kzzsmdgsjnkhtbzhjlyl.supabase.co/storage/v1/object/public/portfolio/shh-creative/media/puppai-collar.webp" alt="" loading="lazy" />
  <img class="pup-photo pup-feather pup-phone" data-fx="scroll" src="https://kzzsmdgsjnkhtbzhjlyl.supabase.co/storage/v1/object/public/portfolio/shh-creative/media/puppai-phone.webp" alt="" loading="lazy" />
</div>
