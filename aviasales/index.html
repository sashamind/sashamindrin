<script>
(() => {
  /* единицы — viewBox логотипа (высота 30, средняя линия y=15); шаг буквы «а» ≈ 12 */
  const BASE_W = 143.7, TEXT_X = 36.7, A_X = 35.51, A_W = 10.31, STEP = 12.0, MID = 15, BASE = 21;
  const SPLIT = TEXT_X + 45.82 + 0.9;   /* конец «авиа» — отсюда начинается нить из новых «а» */
  const ROW = 14.5;
  const CLAMP = 12;
  const STIFF = [[2, 1.86], [4, 3.3]];  /* через сколько букв и не ближе скольких шагов — жёсткость нити на изгиб */
  const CROWD_MAX = 18;                 /* сколько соседей рядом — уже тесно, новую «а» туда не вставляем */                     /* сколько «а» у каждого конца держатся линии логотипа */                     /* ближе этого витки нити друг к другу не подходят */
  const ADD_EVERY = 95, ADD_MIN = 70;
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.getElementById('logo'), all = document.getElementById('all');
  const hit = document.getElementById('hit'), glyphsG = document.getElementById('glyphs');

  /* неподвижные знаки: иконка, «авиа» до вставки, «сейлс» после */
  const fixed = [...glyphsG.children].map(el => ({
    el, cx: +el.dataset.cx, tail: el.dataset.tail === '1'
  }));
  /* два слоя нити: участки верхнего слоя проходят поверх нижнего — нить может перехлёстываться */
  const lowG = document.createElementNS(NS, 'g'), haloG = document.createElementNS(NS, 'g'), highG = document.createElementNS(NS, 'g');
  /* под буквами верхнего слоя — их обводка цветом фона: перекрывает нижний слой в местах перехлёста,
     но не съедает соседние буквы того же слоя */
  haloG.id = 'halo';
  glyphsG.insertBefore(lowG, fixed.find(g => g.tail).el);
  glyphsG.appendChild(haloG);
  glyphsG.appendChild(highG);

  let scale = 1, GAP = 300, VW = 600, VH = 400, maxN = 100, straightN = 8;
  let active = false, lastStep = 0, born = 0;
  const pool = [];
  const chain = [];   /* частицы нити от «авиа» к «сейлс»: {x,y,px,py,p,v,curl,el} */

  function takeEl(g) {
    const u = pool.pop() || document.createElementNS(NS, 'use');
    u.setAttribute('href', '#a');
    u.style.display = '';
    g.appendChild(u);
    return u;
  }
  function dropEl(u) { if (u) { u.style.display = 'none'; pool.push(u); } }

  function layout() {
    const vw = innerWidth, vh = innerHeight;
    const restPx = Math.min(280, vw * (vw < 600 ? 0.31 : 0.21));
    scale = restPx / BASE_W;
    VW = vw / scale; VH = vh / scale;
    GAP = VW * 0.92 - BASE_W;
    straightN = Math.max(1, Math.floor(GAP / STEP));
    /* сколько «а» поместится, если нить заполнит экран витками */
    const area = (VW - 16) * (VH - 16);
    maxN = Math.min(1100, Math.max(straightN, Math.floor(area * 0.36 / (STEP * ROW))));
    svg.setAttribute('viewBox', `${-VW / 2} ${-VH / 2} ${VW} ${VH}`);
    hit.style.strokeWidth = 40;
  }

  function start() { active = true; }
  function stop() { active = false; }
  /* мышь: растёт, пока курсор на логотипе или стоит там, где был на нём в последний раз
     (нить может уехать из-под неподвижного курсора); сдвинули мимо логотипа — отпускаем */
  let ax = 0, ay = 0;
  addEventListener('pointermove', e => {
    if (e.pointerType !== 'mouse') return;
    if (all.contains(e.target)) { start(); ax = e.clientX; ay = e.clientY; }
    else if (active && Math.hypot(e.clientX - ax, e.clientY - ay) > 6) stop();
  });
  document.documentElement.addEventListener('mouseleave', stop);
  all.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse') { start(); svg.setPointerCapture(e.pointerId); } });
  addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') stop(); });
  addEventListener('pointercancel', stop);
  addEventListener('resize', layout);

  /* концы нити: «авиа» слева и «сейлс» справа; пока нить короче промежутка — логотип по центру */
  let Hx = 0, Tx = 0;

  function physics(slack, wave) {
    const N = chain.length;
    const left = -VW / 2 + 10, right = VW / 2 - 10, top = -VH / 2 + 14, bottom = VH / 2 - 14;
    /* инерция + лёгкое дыхание, чтобы нить жила */
    for (let i = 0; i < N; i++) {
      const c = chain[i];
      const vx = (c.x - c.px) * 0.76, vy = (c.y - c.py) * 0.76;
      c.px = c.x; c.py = c.y;
      c.x += vx; c.y += vy;
      /* отпустили — нить тянется обратно к линии; держат — лёгкая тяга к центру, витки заполняют и середину */
      if (!active) c.y -= c.y * 0.06 * slack;
      else {
        c.x -= c.x * 0.0004 * slack; c.y -= c.y * 0.0006 * slack;
        /* пока изгиб только начинается — левую половину нити мягко тянет вверх, правую вниз */
        c.y -= 0.14 * (1 - slack) * Math.sin(2 * Math.PI * (i + 1) / (N + 1));
      }
    }
    /* направление нити в каждой точке — для перехлёстов */
    for (let i = 0; i < N; i++) {
      const a = chain[i - 1], b = chain[i + 1], c = chain[i];
      const dx = (b ? b.x : Tx) - (a ? a.x : Hx), dy = (b ? b.y : 0) - (a ? a.y : 0), l = Math.hypot(dx, dy) || 1;
      c.tx = dx / l; c.ty = dy / l;
    }
    squeezeSum = 0; squeezeN = 0;
    for (let it = 0; it < 14; it++) {
      /* длина звеньев: от «авиа» через все «а» до «сейлс» */
      for (let i = 0; i <= N; i++) {
        const a = chain[i - 1], b = chain[i];
        const ax_ = a ? a.x : Hx, ay_ = a ? a.y : 0, bx = b ? b.x : Tx, by = b ? b.y : 0;
        const dx = bx - ax_, dy = by - ay_, d = Math.hypot(dx, dy) || 1e-6;
        const rest = STEP * ((a ? Math.max(0, a.p) : 0) + (b ? Math.max(0, b.p) : 0)) / 2;
        const diff = (d - rest) / d;
        if (it === 13 && rest > STEP * 0.9 && i > CLAMP && i < N - CLAMP) { squeezeSum += Math.min(1, d / rest); squeezeN++; }
        const wa = a ? (b ? 0.5 : 1) : 0, wb = b ? (a ? 0.5 : 1) : 0;
        if (a) { a.x += dx * diff * wa; a.y += dy * diff * wa; }
        if (b) { b.x -= dx * diff * wb; b.y -= dy * diff * wb; }
      }
      /* упругость: буквы через одну и через три не подходят слишком близко —
         нить не может сломаться острым углом, только изгибается плавной дугой */
      for (const [gap, minK] of STIFF) {
        for (let i = 0; i + gap < N; i++) {
          const a = chain[i], b = chain[i + gap];
          if (a.p < 0.9 || b.p < 0.9) continue;
          const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1e-6, min = minK * STEP;
          if (d >= min) continue;
          const push = (min - d) / d * 0.25;
          a.x -= dx * push; a.y -= dy * push; b.x += dx * push; b.y += dy * push;
        }
      }
      /* изгиб: у каждой «а» своя склонность закручиваться — так нить петляет и сворачивается */
      for (let i = 0; i < N; i++) {
        const c = chain[i], a = chain[i - 1], b = chain[i + 1];
        const ax_ = a ? a.x : Hx - STEP, ay_ = a ? a.y : 0, bx = b ? b.x : Tx + STEP, by = b ? b.y : 0;
        const mx = (ax_ + bx) / 2, my = (ay_ + by) / 2;
        const tx = bx - ax_, ty = by - ay_, tl = Math.hypot(tx, ty) || 1;
        /* куда сдвинуть середину, чтобы угол стал «свой» */
        /* у концов — упругий плавный выход из «авиа» и вход в «сейлс», без закручивания */
        const e = Math.min(i, N - 1 - i), ef = Math.min(1, e / 8);
        /* в начале изгиба — волна: левая половина выгибается вверх, правая вниз */
        const want = (c.curl * slack - 0.08 * wave * Math.sin(2 * Math.PI * (i + 1) / (N + 1))) * tl * 0.5 * ef;
        const nx = -ty / tl, ny = tx / tl;
        const gx = mx + nx * want, gy = my + ny * want;
        const k = 0.2 + 0.45 * (1 - ef);
        c.x += (gx - c.x) * k; c.y += (gy - c.y) * k;
      }
      /* упругие концы: первые и последние «а» выходят из логотипа по его линии и только потом
         плавно уходят в сторону — как гибкая пластинка, зажатая в логотипе */
      for (let i = 0; i < Math.min(CLAMP, N); i++) {
        const w = 0.3 * (1 - i / CLAMP) ** 2;
        const c = chain[i], o = chain[N - 1 - i];
        c.y -= c.y * w; o.y -= o.y * w;
      }
      /* крайние «а» приклеены к логотипу, следующие уходят из него только вперёд */
      if (N > 2) {
        const f = chain[0], l = chain[N - 1];
        f.x = Hx + STEP * Math.max(0, f.p) / 2; f.y = 0;
        l.x = Tx - STEP * Math.max(0, l.p) / 2; l.y = 0;
        for (let i = 1; i < Math.min(CLAMP, N >> 1); i++) {
          const c = chain[i], o = chain[N - 1 - i], lim = STEP * (0.5 + i * 0.7);
          if (c.x < Hx + lim) c.x += (Hx + lim - c.x) * 0.5;
          if (o.x > Tx - lim) o.x += (Tx - lim - o.x) * 0.5;
        }
      }
      /* края экрана — мягкая стенка: у границы нить пружинит, а не сминается гармошкой */
      for (let i = 0; i < N; i++) {
        const c = chain[i];
        if (c.x < left + 24) c.x += (left + 24 - c.x) * 0.08; else if (c.x > right - 24) c.x += (right - 24 - c.x) * 0.08;
        if (c.y < top + 24) c.y += (top + 24 - c.y) * 0.08; else if (c.y > bottom - 24) c.y += (bottom - 24 - c.y) * 0.08;
        if (c.x < left) c.x = left; else if (c.x > right) c.x = right;
        if (c.y < top) c.y = top; else if (c.y > bottom) c.y = bottom;
      }
      if (it % 2) repel();
    }
  }

  /* витки не ложатся друг на друга и на сам логотип */
  const grid = new Map();
  const statics = [];
  function repel() {
    grid.clear();
    const N = chain.length, cell = ROW;
    for (let i = 0; i < N; i++) {
      const c = chain[i], key = Math.floor(c.x / cell) * 73856093 ^ Math.floor(c.y / cell) * 19349663;
      let arr = grid.get(key); if (!arr) grid.set(key, arr = []); arr.push(i);
    }
    for (let i = 0; i < N; i++) {
      const c = chain[i], gx = Math.floor(c.x / cell), gy = Math.floor(c.y / cell);
      for (let ox = -1; ox <= 1; ox++) for (let oy = -1; oy <= 1; oy++) {
        const arr = grid.get((gx + ox) * 73856093 ^ (gy + oy) * 19349663);
        if (!arr) continue;
        for (const j of arr) {
          if (j <= i + 1) continue;
          const o = chain[j];
          const dx = o.x - c.x, dy = o.y - c.y, d2 = dx * dx + dy * dy;
          /* разные слои могут пересекаться — нить перехлёстывается крест-накрест;
             но если участки идут почти параллельно, они расталкиваются, чтобы не слипаться в ком */
          if (o.z !== c.z && Math.abs(c.tx * o.tx + c.ty * o.ty) < 0.65) continue;
          const r = ROW * Math.min(1, (c.p + o.p) / 2 + 0.2);
          if (d2 >= r * r || d2 < 1e-8) continue;
          const d = Math.sqrt(d2), push = (r - d) / d * 0.45;
          c.x -= dx * push; c.y -= dy * push; o.x += dx * push; o.y += dy * push;
        }
      }
    }
    /* «авиа» и «сейлс» — запретные прямоугольники: нить их огибает */
    for (const b of statics) {
      for (let i = 0; i < N; i++) {
        const c = chain[i];
        if (c.x <= b.x0 || c.x >= b.x1 || c.y <= -b.h || c.y >= b.h) continue;
        const dl = c.x - b.x0, dr = b.x1 - c.x, du = c.y + b.h, dd = b.h - c.y;
        const m = Math.min(dl, dr, du, dd);
        const f = 0.4;
        if (m === du) c.y += (-b.h - c.y) * f; else if (m === dd) c.y += (b.h - c.y) * f;
        else if (m === dl) c.x += (b.x0 - c.x) * f; else c.x += (b.x1 - c.x) * f;
      }
    }
  }

  function crowd(c) {
    const gx = Math.floor(c.x / ROW), gy = Math.floor(c.y / ROW);
    let n = 0;
    for (let ox = -2; ox <= 2; ox++) for (let oy = -2; oy <= 2; oy++) {
      const arr = grid.get((gx + ox) * 73856093 ^ (gy + oy) * 19349663); if (arr) n += arr.length;
    }
    /* у краёв экрана тоже тесно */
    const ex = VW / 2 - Math.abs(c.x), ey = VH / 2 - Math.abs(c.y);
    return n + (ex < 40 ? 6 : 0) + (ey < 40 ? 6 : 0);
  }

  let lastT = 0, bentSign = 0, squeezeSum = 0, squeezeN = 0;
  function frame(t) {
    lastT = t;
    /* по одной «а» за шаг; когда нить уже гнётся — всё чаще */
    const N0 = chain.length;
    const every = N0 < straightN * 0.6 ? ADD_EVERY : Math.max(ADD_MIN, ADD_EVERY * 1.4 - (N0 - straightN * 0.6) * 0.2);
    /* нить пережата (буквы налезают друг на друга) — новые «а» добавляются реже, пока она не расправится */
    const squeeze = squeezeN > 20 ? squeezeSum / squeezeN : 1;
    const wait = every * (1 + Math.max(0, 0.985 - squeeze) * 25);
    if (active && N0 < maxN && t - lastStep > Math.min(wait, every * 3)) {
      lastStep = t;
      /* новая «а» рождается в середине нити и расталкивает соседей в обе стороны */
      /* сначала ровно из середины; когда нить уже петляет — там, где вокруг свободнее,
         чтобы она не сбивалась в один ком, а расползалась по всему экрану */
      let k = N0 >> 1;
      if (N0 > straightN * 1.8) {
        let best = 1e9;
        for (let q = 0; q < 10; q++) {
          const i = 2 + Math.floor(Math.random() * (N0 - 4)), d = crowd(chain[i]);
          if (d < best) { best = d; k = i; }
        }
        /* свободного места нет — ждём, пока нить сама расправится, а не вдавливаем новую «а» силой */
        if (best > CROWD_MAX) k = -1;
      }
      if (k >= 0) {
      const a = chain[k - 1], b = chain[k];
      const x = ((a ? a.x : Hx) + (b ? b.x : Tx)) / 2, y = ((a ? a.y : 0) + (b ? b.y : 0)) / 2 + (Math.random() - 0.5) * 0.3;
      /* слой меняется участками: часть нити лежит поверх остальной */
      const z = born > straightN * 2.5 && Math.sin(born * 0.05) > 0.35 ? 1 : 0;
      chain.splice(k, 0, { x, y, px: x, py: y, rx: x, ry: y, p: 0, v: 0, dying: false, z,
        curl: 0.1 * Math.min(1, Math.max(0, (born - straightN * 1.3) / 40)) * Math.sin(born * 0.035 + 1)  /* первые «а» не закручиваются — прогиб задаёт волна; дальше у каждой своя склонность, плавно то в одну, то в другую сторону */, el: takeEl(z ? highG : lowG), halo: z ? takeEl(haloG) : null });
      born++;
      }
    }
    if (active) for (const c of chain) c.dying = false;
    else if (N0) {
      /* отпустили — «а» тают из середины: сначала много сразу, под конец всё реже,
         и логотип собирается с плавным замедлением */
      let alive = 0;
      for (const c of chain) if (!c.dying) alive++;
      const gap = 18 + 170 * Math.max(0, 1 - alive / straightN) ** 2;
      if (alive && t - lastStep > gap) {
        lastStep = t;
        const m = alive > straightN ? Math.ceil(alive * 0.035) : 1;
        for (let q = 0; q < m; q++) {
          let best = -1, bd = 1e9;
          for (let i = 0; i < chain.length; i++) if (!chain[i].dying) { const dd = Math.abs(i - chain.length / 2); if (dd < bd) { bd = dd; best = i; } }
          if (best < 0) break;
          chain[best].dying = true;
        }
      }
    }

    /* рост новых «а» — пружинкой; тающие сжимаются плавно, без отскока */
    let len = 0;
    for (let i = chain.length - 1; i >= 0; i--) {
      const c = chain[i];
      if (c.dying) {
        c.p += (0 - c.p) * 0.16; c.v = 0;
        if (c.p < 0.02) { dropEl(c.el); dropEl(c.halo); chain.splice(i, 1); continue; }
      } else if (bentSign) {
        /* когда нить уже гнётся — новая «а» вырастает медленно и без отскока,
           чтобы соседи успевали расступиться, а не сминались складками */
        c.p += (1 - c.p) * 0.05; c.v = 0;
      } else { c.v += (1 - c.p) * 0.22; c.v *= 0.68; c.p += c.v; }
      len += STEP * Math.max(0, c.p);
    }
    if (!chain.length) born = 0;

    /* края подходят к границам экрана с замедлением: нить начинает гнуться заранее и понемногу */
    const SOFT = 0.65 * GAP;
    const span = len < SOFT ? len : SOFT + (GAP - SOFT) * (1 - Math.exp(-(len - SOFT) / (GAP - SOFT)));
    const x0 = -(BASE_W + span) / 2;
    Hx = x0 + SPLIT; Tx = Hx + span;
    statics.length = 0;
    statics.push({ x0: x0 - 10, x1: x0 + 36, h: 25 });
    statics.push({ x0: x0 + 36, x1: Hx + 2, h: 16 });
    statics.push({ x0: Tx - 2, x1: Tx + BASE_W - SPLIT + 12, h: 16 });

    if (len - span < 0.5) {
      /* пока влезает — ровная строка; если нить ещё изогнута (собирается обратно) — плавно ложится в неё */
      let s = Hx, bent = 0;
      for (const c of chain) {
        const w = STEP * Math.max(0, c.p);
        const tx = s + w / 2; s += w;
        if (bentSign) { c.x += (tx - c.x) * 0.14; c.y += (0 - c.y) * 0.14; bent = Math.max(bent, Math.abs(c.y), Math.abs(c.x - tx)); }
        else { c.x = tx; c.y = 0; }
        c.px = c.x; c.py = c.y;
      }
      if (bent < 0.3) bentSign = 0;
    } else {
      /* в момент упора нить не обрушивается одной большой дугой, а начинает мелко волниться
         по всей длине — волны плавно растут, и дальше уже петляют */
      if (!bentSign) {
        bentSign = -1;   /* первый прогиб — волной: слева вверх, справа вниз */
        const N = chain.length;
        chain.forEach((c, i) => { const t = (i + 1) / (N + 1); c.y += bentSign * 0.8 * Math.sin(2 * Math.PI * t); c.py = c.y; });
      }
      physics(Math.min(1, (len - span) / 300), Math.max(0, 1 - (len - span) / 1200));
    }

    /* отрисовка */
    for (const g of fixed) {
      const x = g.tail ? Tx + g.cx - SPLIT : x0 + g.cx;
      g.el.setAttribute('transform', `translate(${x} 0) translate(${-g.cx} ${-MID})`);
    }
    const cx = A_X + A_W / 2;
    let d = `M${x0} 0L${Hx} 0`;
    /* на экран — сглаженные позиции, чтобы буквы не дрожали */
    for (const c of chain) { c.rx += (c.x - c.rx) * 0.25; c.ry += (c.y - c.ry) * 0.25; }
    for (let i = 0; i < chain.length; i++) {
      const c = chain[i], a = chain[i - 1], b = chain[i + 1];
      const ax_ = a ? a.rx : Hx, ay_ = a ? a.ry : 0, bx = b ? b.rx : Tx, by = b ? b.ry : 0;
      /* «а» никогда не встаёт вверх ногами (иначе читается как «е»); переворачивается с запасом,
         чтобы на вертикальных участках не щёлкала туда-сюда, и поворачивается плавно */
      let ang = Math.atan2(by - ay_, bx - ax_) * 180 / Math.PI + (c.flip ? 180 : 0);
      ang = ((ang + 540) % 360) - 180;
      if (Math.abs(ang) > 120) { c.flip = !c.flip; ang = ((ang + 360) % 360) - 180; }
      if (c.ra === undefined) c.ra = ang;
      c.ra += ((((ang - c.ra) + 540) % 360) - 180) * 0.3;
      ang = c.ra;
      const p = Math.max(0, c.p);
      const tr = `translate(${c.rx} ${c.ry}) rotate(${ang}) translate(${-cx} ${-MID}) translate(${cx} ${BASE}) scale(${p}) translate(${-cx} ${-BASE})`;
      c.el.setAttribute('transform', tr);
      if (c.halo) c.halo.setAttribute('transform', tr);
      if (i % 2 === 0) d += `L${c.rx.toFixed(1)} ${c.ry.toFixed(1)}`;
    }
    d += `L${Tx} 0L${Tx + BASE_W - SPLIT} 0`;
    /* зона наведения — весь логотип вместе с нитью */
    hit.setAttribute('d', d);
    requestAnimationFrame(frame);
  }

  layout();
  requestAnimationFrame(frame);
})();
