       в том числе вложенному (/a/b/c) — base держит пути от корня сайта. -->

  <style>
    /* тонкое начертание только для цифр 404 — в основном Inter его нет */
    @font-face {
      font-family: 'Inter Thin404';
      src: url('assets/fonts/Inter-ExtraLight-latin.woff2') format('woff2');
      font-weight: 200;
      font-display: swap;
    }
    .nf {
      min-height: calc(100vh - 160px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }
    .nf .pd-guy { width: 38px; margin-bottom: 28px; }
    .nf-code {
      font-family: 'Inter Thin404', 'Inter', sans-serif;
      font-weight: 200;
      font-size: clamp(72px, 14vw, 160px);
      line-height: 1;
      letter-spacing: -0.04em;
      color: var(--fg);
    }
    /* наведение на 404: цифры чуть хаотично сдвигаются и поворачиваются */
    .nf-code { cursor: default; -webkit-tap-highlight-color: transparent; }
    .nf-d {
      display: inline-block;
      transition: transform 0.45s cubic-bezier(.34, 1.56, .64, 1);
    }
    @media (prefers-reduced-motion: reduce) { .nf-d { transition: none; } }
    /* на телефоне 404 крупнее — почти во всю ширину */
    @media (max-width: 600px) { .nf-code { font-size: 42vw; } }
    .nf-text {
      margin-top: 18px;
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      font-size: 15px;
      line-height: 1.6;
      color: var(--fg2);
    }
    .nf-link {
      margin-top: 36px;
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: lowercase;
      color: var(--fg);
      text-decoration: none;
      border-bottom: 0.5px solid var(--border);
      padding-bottom: 4px;
      transition: border-color 0.2s ease;
    }
    .nf-link:hover { border-bottom-color: var(--fg); }
  </style>
</head>
<body class="dark">

  <script src="main.js?v=20261006-2"></script>
  <script>
    // чувачок с главной: оглядывается, ищет потерявшуюся страницу,
    // потом следит за курсором
    if (typeof mountGuy === 'function') mountGuy(document.querySelector('.nf .pd-guy'));
    // 404 «разбегается» под курсором: каждая цифра — случайный сдвиг и
    // поворот; пока курсор двигается по цифрам, раз в ~0.3 с новый разброс.
    // На тач-экране тап встряхивает цифры, через секунду они встают на место.
    (function () {
      var code = document.querySelector('.nf-code');
      if (!code || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      var digits = code.querySelectorAll('.nf-d'), last = 0, backT = 0;
      function rnd(a) { return (Math.random() * 2 - 1) * a; }
      function shake() {
        var em = parseFloat(getComputedStyle(code).fontSize);
        digits.forEach(function (d) {
          d.style.transform = 'translate(' + rnd(em * 0.05).toFixed(1) + 'px,' + rnd(em * 0.07).toFixed(1) + 'px) rotate(' + rnd(9).toFixed(1) + 'deg)';
        });
        last = performance.now();
      }
      function reset() { digits.forEach(function (d) { d.style.transform = ''; }); }
      code.addEventListener('pointerenter', function (e) { if (e.pointerType === 'mouse') shake(); });
      code.addEventListener('pointermove', function (e) { if (e.pointerType === 'mouse' && performance.now() - last > 300) shake(); });
      code.addEventListener('pointerleave', function (e) { if (e.pointerType === 'mouse') reset(); });
      code.addEventListener('pointerdown', function (e) {
        if (e.pointerType === 'mouse') return;
        shake(); clearTimeout(backT); backT = setTimeout(reset, 1000);
      });
    })();

    // чувачок стоит ровно над нулём: центр его тела — по центру «0»
    (function () {
      var guy = document.querySelector('.nf .pd-guy'), zero = document.querySelector('.nf-zero');
      var body = guy && guy.querySelector('.g-body');
      if (!guy || !zero || !body) return;
      function place() {
        guy.style.transform = '';
        // положение нуля без его сдвига от «разбегания»
        var zt = zero.style.transform; zero.style.transform = '';
        var z = zero.getBoundingClientRect(), b = body.getBoundingClientRect();
        zero.style.transform = zt;
        if (!b.width) return;
        guy.style.transform = 'translateX(' + ((z.left + z.width / 2) - (b.left + b.width / 2)).toFixed(1) + 'px)';
      }
      place();
      window.addEventListener('resize', place);
      if (document.fonts) document.fonts.ready.then(place);
    })();
  </script>
